<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Shift History · Baybella</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#211C18;--ink2:#463E37;--grey:#8C8279;--pink:#E5147F;--pink-deep:#BE185D;--line-soft:#EAD9E4;
  --purple:#7C3AED;--serif:'Fraunces',Georgia,serif;--sans:'Manrope',system-ui,sans-serif;
  --green:#15803D;--green-bg:#E4F6EA;--amber:#B45309;--amber-bg:#FBEBCB;
}
*{margin:0;padding:0;box-sizing:border-box}
html{background:#FDF4F8}
body{font-family:var(--sans);background:linear-gradient(160deg,#FCE3F0 0%,#F1E7FB 55%,#E7E7FB 100%);background-attachment:fixed;color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;position:relative;min-height:100vh}
.blooms{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blooms::before{content:"";position:absolute;top:-220px;right:-200px;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,#F9A8C9 0%,transparent 70%);opacity:.6}
.wrap{max-width:880px;margin:0 auto;padding:0 20px;position:relative;z-index:1}

.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#F49AC1 0%,#BBA2E8 100%);border:1px solid #E58BB4;border-radius:24px;padding:clamp(28px,5vw,40px) clamp(24px,5vw,40px);margin:26px 0 14px;text-align:center;box-shadow:0 28px 60px -28px rgba(150,40,100,.55),inset 0 1px 0 rgba(255,255,255,.4)}
.hero .logo{font-family:var(--serif);font-weight:500;font-size:1.5rem;letter-spacing:.22em;color:var(--ink);margin-bottom:12px}
.hero .eyebrow{font-size:.72rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--pink);margin-bottom:10px}
.hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(1.5rem,4vw,2rem);letter-spacing:-.02em;color:var(--ink)}
.hero .period{font-family:var(--serif);font-style:italic;font-size:1.05rem;color:#5a2540;margin-top:10px}

/* weekly pace scoreboard */
.weekcard{background:#fff;border:1px solid var(--line-soft);border-radius:18px;padding:22px 24px 24px;margin:16px 0 6px;box-shadow:0 20px 46px -34px rgba(60,30,30,.55)}
.wk-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.wk-label{font-size:.7rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--pink)}
.wk-pill{font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:6px 14px;border-radius:30px;white-space:nowrap}
.wk-pill.ok{color:var(--green);background:var(--green-bg);border:1px solid #BBE6C8}
.wk-pill.warn{color:var(--amber);background:var(--amber-bg);border:1px solid #F1D79A}
.wk-pill.bad{color:var(--pink-deep);background:#FCDDEA;border:1px solid #F6CDDE}
.wk-num{font-family:var(--serif);font-weight:500;font-size:2.8rem;line-height:1;color:var(--ink);margin:14px 0 4px}
.wk-num .of{font-size:1.4rem;color:var(--grey)}
.wk-bar{position:relative;height:14px;border-radius:10px;background:#F3E7EF;margin:16px 0 12px;overflow:visible}
.wk-fill{position:absolute;left:0;top:0;bottom:0;border-radius:10px;transition:width .5s ease}
.wk-fill.ok{background:linear-gradient(90deg,#34D27F,var(--green))}
.wk-fill.warn{background:linear-gradient(90deg,#F0B44A,var(--amber))}
.wk-fill.bad{background:linear-gradient(90deg,var(--pink),var(--pink-deep))}
.wk-marker{position:absolute;top:-5px;bottom:-5px;width:3px;border-radius:3px;background:var(--ink);opacity:.55}
.wk-marker::after{content:"today";position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:.56rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);white-space:nowrap}
.wk-sub{font-size:.92rem;color:var(--ink2);line-height:1.5}
.wk-sub b{color:var(--ink)}

.tablecard{background:#fff;border:1px solid var(--line-soft);border-radius:18px;padding:6px;margin:16px 0;box-shadow:0 20px 46px -34px rgba(60,30,30,.55);overflow-x:auto}
.tablecard .tcap{font-size:.66rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--purple);padding:14px 14px 4px}
table{width:100%;border-collapse:collapse;font-size:.92rem;min-width:560px}
thead th{font-size:.66rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--purple);text-align:left;padding:10px 14px 12px;border-bottom:2px solid var(--line-soft);white-space:nowrap}
thead th.num,tbody td.num{text-align:center}
tbody td{padding:13px 14px;border-bottom:1px solid #F4E8F0;color:var(--ink2);vertical-align:top}
tbody tr:last-child td{border-bottom:none}
tbody td.date{font-weight:700;color:var(--ink);white-space:nowrap}
tbody td.big{font-family:var(--serif);font-size:1.1rem;color:var(--ink)}
tbody tr.missed{background:#FCEAF1}
tbody tr.missed td.big{color:var(--pink-deep);font-weight:600}
tbody tr.wk-div td{background:#F6ECF4;padding:8px 14px;font-size:.62rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--purple);border-bottom:1px solid var(--line-soft)}
tbody tr.wk-div.now td{color:var(--pink-deep)}
.pill{display:inline-block;font-size:.6rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--pink-deep);background:#FCDDEA;border:1px solid #F6CDDE;border-radius:20px;padding:2px 8px;margin-left:7px;vertical-align:middle}
a.loom{display:inline-block;font-size:.74rem;font-weight:800;letter-spacing:.03em;color:#fff;background:linear-gradient(135deg,var(--pink),var(--purple));border-radius:20px;padding:5px 12px;text-decoration:none;white-space:nowrap;transition:.15s}
a.loom:hover{filter:brightness(1.06)}
.noloom{color:#D8C8D4}
td.notes{color:var(--grey);font-size:.86rem;max-width:220px}
.empty{text-align:center;padding:40px 20px;color:var(--grey);font-family:var(--serif);font-style:italic;font-size:1.05rem}
.loading{text-align:center;padding:50px 20px;color:var(--grey)}

footer{padding:22px 0 50px;text-align:center}
footer .fb{font-family:var(--serif);font-style:italic;font-size:.9rem;color:#a9a098}
</style>
</head>
<body>
<div class="blooms"></div>
<div class="wrap">

  <div class="hero">
    <div class="logo">BAYBELLA</div>
    <div class="eyebrow">Creator Ops</div>
    <h1>Shift history</h1>
    <div class="period" id="period"></div>
  </div>

  <!-- WEEKLY PACE SCOREBOARD -->
  <div class="weekcard" id="weekcard" style="display:none">
    <div class="wk-top">
      <div class="wk-label">This week &middot; creator reviews</div>
      <div class="wk-pill" id="wkPill">—</div>
    </div>
    <div class="wk-num"><span id="wkReviewed">0</span><span class="of"> / <span id="wkTarget">25</span> target</span></div>
    <div class="wk-bar">
      <div class="wk-fill" id="wkFill" style="width:0"></div>
      <div class="wk-marker" id="wkMarker" style="left:0"></div>
    </div>
    <div class="wk-sub" id="wkSub"></div>
  </div>

  <!-- MONTHLY RECORD -->
  <div class="tablecard">
    <div class="tcap" id="tcap">Daily log</div>
    <div class="loading" id="loading">Loading the record…</div>
    <table id="tbl" style="display:none">
      <thead><tr>
        <th>Date</th>
        <th class="num">Creators</th>
        <th class="num">Orders</th>
        <th class="num">Snippets</th>
        <th class="num">Loom</th>
        <th>Notes</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <footer><div class="fb">Baybella &middot; weekly target 50 (10 creator reviews &times; 5 weekdays)</div></footer>
</div>

<script>
function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }
var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
var DAILY_TARGET = 10, WORK_DAYS = 5, WEEK_TARGET = DAILY_TARGET * WORK_DAYS;

// In the real app this is "now" in Manila; in local preview it's a fixed date so the demo makes sense.
var IS_APP = (typeof google !== 'undefined' && google.script && google.script.run);
var PREVIEW_TODAY = '2026-06-17'; // a Wednesday

function todayManilaStr(){
  if (IS_APP) return new Date().toLocaleDateString('en-CA', {timeZone:'Asia/Manila'}); // yyyy-mm-dd
  return PREVIEW_TODAY;
}
function addDays(str, n){
  var d = new Date(str+'T00:00:00'); d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function dow(str){ return new Date(str+'T00:00:00').getDay(); } // 0=Sun..6=Sat
var MON_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function mondayOf(str){ return addDays(str, -((dow(str)+6)%7)); }
function shortDate(str){ var d=new Date(str+'T00:00:00'); return MON_SHORT[d.getMonth()]+' '+d.getDate(); }

function weekScoreboard(allRows){
  var today = todayManilaStr();
  var back = (dow(today)+6) % 7;          // days since Monday (Mon=0)
  var monday = addDays(today, -back);

  // latest submission per day (rows arrive newest-first), summed across this week so far
  var seen = {}, reviewed = 0;
  allRows.forEach(function(r){
    var d = String(r.date);
    if (seen[d]) return; seen[d] = true;
    if (d >= monday && d <= today) reviewed += (Number(r.creators)||0);
  });

  // working days elapsed this week, including today (capped at 5)
  var elapsed = 0;
  for (var i=0;i<7;i++){ var d=addDays(monday,i); if (d>today) break; var w=dow(d); if (w>=1 && w<=5) elapsed++; }
  elapsed = Math.min(elapsed, WORK_DAYS);
  var expected = DAILY_TARGET * elapsed;
  var deficit = expected - reviewed;

  var cls, label;
  if (deficit <= 0){ cls='ok'; label = reviewed>expected ? 'Ahead' : 'On track'; }
  else if (deficit <= DAILY_TARGET){ cls='warn'; label='Slightly behind'; }
  else { cls='bad'; label='Behind'; }

  document.getElementById('wkTarget').textContent = WEEK_TARGET;
  document.getElementById('wkReviewed').textContent = reviewed;
  var pill = document.getElementById('wkPill');
  pill.textContent = label; pill.className = 'wk-pill '+cls;
  var fill = document.getElementById('wkFill');
  fill.style.width = Math.min(100, reviewed/WEEK_TARGET*100)+'%'; fill.className = 'wk-fill '+cls;
  document.getElementById('wkMarker').style.left = Math.min(100, expected/WEEK_TARGET*100)+'%';

  var sub;
  if (deficit <= 0){
    sub = '<b>'+reviewed+'</b> reviewed so far this week. By today you&rsquo;d expect <b>'+expected+'</b> — '+
          (reviewed>expected ? ('you&rsquo;re <b>'+(reviewed-expected)+' ahead</b>. ') : 'right on pace. ')+
          'Target is '+WEEK_TARGET+' for the full week.';
  } else {
    sub = '<b>'+reviewed+'</b> reviewed so far. By today you&rsquo;d expect <b>'+expected+'</b> — that&rsquo;s <b>'+
          deficit+' behind</b> the pace needed to hit '+WEEK_TARGET+' by Friday.';
  }
  document.getElementById('wkSub').innerHTML = sub;
  document.getElementById('weekcard').style.display = 'block';
}

function currentPeriod(rows){
  if (IS_APP){ return todayManilaStr().slice(0,7); }
  return rows.length ? String(rows[0].date).slice(0,7) : '';
}

function render(allRows){
  document.getElementById('loading').style.display = 'none';
  allRows = allRows || [];

  if (allRows.length) weekScoreboard(allRows);

  var period = currentPeriod(allRows);
  if (period){ var p=period.split('-'); document.getElementById('period').textContent = MONTHS[parseInt(p[1],10)-1]+' '+p[0]; }
  document.getElementById('tcap').textContent = 'Daily log — ' + (period ? MONTHS[parseInt(period.split('-')[1],10)-1] : '');

  var rows = allRows.filter(function(r){ return String(r.date).slice(0,7) === period; });
  if (!rows.length){
    document.getElementById('loading').style.display='block';
    document.getElementById('loading').className='empty';
    document.getElementById('loading').textContent='No shifts logged yet this month.';
    return;
  }
  var thisMon = mondayOf(todayManilaStr());
  var curWeek = null, html = '';
  rows.forEach(function(r){
    var mon = mondayOf(String(r.date));
    if (mon !== curWeek){
      curWeek = mon;
      var isNow = (mon === thisMon);
      var lbl = isNow ? 'This week &middot; '+shortDate(mon) : 'Week of '+shortDate(mon);
      html += '<tr class="wk-div'+(isNow?' now':'')+'"><td colspan="6">'+lbl+'</td></tr>';
    }
    html += '<tr class="'+(r.missed?'missed':'')+'">'+
      '<td class="date">'+esc(r.date)+'</td>'+
      '<td class="num big">'+esc(r.creators)+(r.missed?'<span class="pill">missed</span>':'')+'</td>'+
      '<td class="num big">'+esc(r.orders)+'</td>'+
      '<td class="num big">'+esc(r.snippets)+'</td>'+
      '<td class="num">'+(r.loom ? '<a class="loom" href="'+esc(r.loom)+'" target="_blank" rel="noopener">&#9654; Watch</a>' : '<span class="noloom">&mdash;</span>')+'</td>'+
      '<td class="notes">'+esc(r.notes)+'</td>'+
    '</tr>';
  });
  document.getElementById('rows').innerHTML = html;
  document.getElementById('tbl').style.display = 'table';
}

if (IS_APP){
  google.script.run.withSuccessHandler(render).withFailureHandler(function(){
    document.getElementById('loading').textContent = 'Could not load the record. Refresh to retry.';
  }).getHistory();
} else {
  // local preview sample — week of Mon 06-15, "today" = Wed 06-17 → 27 reviewed vs 30 expected (slightly behind)
  render([
    {date:'2026-06-17', creators:9,  orders:0, snippets:0, loom:'https://www.loom.com/share/abc', notes:'', missed:true},
    {date:'2026-06-16', creators:8,  orders:0, snippets:1, loom:'https://www.loom.com/share/abc', notes:'sample row', missed:true},
    {date:'2026-06-15', creators:10, orders:1, snippets:0, loom:'https://www.loom.com/share/abc', notes:'', missed:false},
    {date:'2026-06-12', creators:10, orders:2, snippets:2, loom:'https://www.loom.com/share/abc', notes:'', missed:false},
    {date:'2026-06-11', creators:7,  orders:1, snippets:3, loom:'', notes:'sample row', missed:true}
  ]);
}
</script>
</body>
</html>
